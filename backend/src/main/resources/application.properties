app.jwt.secret=9a6747f3b7b848c48a7e83945d8535cf8b4791e847c293678d8a7b9e0f1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
app.jwt.expiration-ms=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
