server.port=8080

# Application Name
spring.application.name=foodhub-backend

# ===================================================================
# DATABASE CONFIGURATION
# Current Active: H2 In-Memory (Zero setup required, preloaded with demo data)
# Access H2 Web Console: http://localhost:8080/h2-console
# ===================================================================
spring.datasource.url=jdbc:h2:mem:foodhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# OPTION 2: H2 File-based (Persistent without installing MySQL)
# To enable persistent storage across restarts, uncomment below:
# ===================================================================
# spring.datasource.url=jdbc:h2:file:./data/foodhubdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# ===================================================================
# OPTION 3: MySQL 8.x Configuration
# To switch to MySQL:
# 1. Comment out the H2 lines above
# 2. Uncomment the lines below
# 3. Replace 'YOUR_MYSQL_PASSWORD' with your actual MySQL root password
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/foodhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# JWT & Security Configuration
